components:
  schemas:
    AdminDashboardResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          additionalProperties: {}
      required:
      - data
      - success
    Booking:
      type: object
      description: Full booking detail serializer.
      properties:
        id:
          type: integer
          readOnly: true
        customer:
          type: integer
          readOnly: true
        customer_name:
          type: string
          readOnly: true
        customer_email:
          type: string
          readOnly: true
        provider:
          type: integer
          readOnly: true
        provider_name:
          type: string
          readOnly: true
        service:
          type: integer
        service_title:
          type: string
          readOnly: true
        booking_date:
          type: string
          format: date
        preferred_time:
          type: string
          format: time
          nullable: true
        address:
          type: string
          description: Service delivery address
        customer_notes:
          type: string
        provider_notes:
          type: string
        price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/BookingStatusEnum'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - address
      - booking_date
      - created_at
      - customer
      - customer_email
      - customer_name
      - id
      - price
      - provider
      - provider_name
      - service
      - service_title
      - status
