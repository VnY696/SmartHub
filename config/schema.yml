          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ProviderVerificationRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderVerification'
          description: ''
    patch:
      operationId: accounts_providers_verify_partial_update
      description: |-
        PATCH /api/accounts/providers/{id}/verify/
        Admin-only: approve or reject a provider.
      parameters:
